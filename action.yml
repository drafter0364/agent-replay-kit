name: Agent Replay Kit
description: Validate and assert Agent Replay Kit traces in GitHub Actions.

inputs:
  mode:
    description: validate, assert, analyze, test, or validate-and-assert.
    required: false
    default: validate-and-assert
  trace:
    description: Trace file for validate/assert modes.
    required: false
  policy:
    description: Optional assertion policy JSON file.
    required: false
  config-file:
    description: Optional flat JSON config file passed through to the CLI command.
    required: false
  baseline:
    description: Baseline trace for test mode.
    required: false
  actual:
    description: Actual trace for test mode.
    required: false
  format:
    description: Output format, markdown or json.
    required: false
    default: markdown
  max-shell-calls:
    description: Optional max shell-call threshold for analyze mode.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/package-lock.json

    - name: Install Agent Replay Kit
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build Agent Replay Kit
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Run Agent Replay Kit
      shell: bash
      env:
        AGENT_REPLAY_MODE: ${{ inputs.mode }}
        AGENT_REPLAY_TRACE: ${{ inputs.trace }}
        AGENT_REPLAY_POLICY: ${{ inputs.policy }}
        AGENT_REPLAY_CONFIG_FILE: ${{ inputs.config-file }}
        AGENT_REPLAY_BASELINE: ${{ inputs.baseline }}
        AGENT_REPLAY_ACTUAL: ${{ inputs.actual }}
        AGENT_REPLAY_FORMAT: ${{ inputs.format }}
        AGENT_REPLAY_MAX_SHELL_CALLS: ${{ inputs.max-shell-calls }}
        AGENT_REPLAY_CLI: ${{ github.action_path }}/dist/cli.js
      run: |
        set -euo pipefail

        policy_args=()
        if [[ -n "${AGENT_REPLAY_POLICY}" ]]; then
          policy_args=(--policy "${AGENT_REPLAY_POLICY}")
        fi

        config_args=()
        if [[ -n "${AGENT_REPLAY_CONFIG_FILE}" ]]; then
          config_args=(--config-file "${AGENT_REPLAY_CONFIG_FILE}")
        fi

        analyze_args=()
        if [[ -n "${AGENT_REPLAY_MAX_SHELL_CALLS}" ]]; then
          analyze_args=(--max-shell-calls "${AGENT_REPLAY_MAX_SHELL_CALLS}")
        fi

        case "${AGENT_REPLAY_MODE}" in
          validate)
            node "${AGENT_REPLAY_CLI}" validate "${AGENT_REPLAY_TRACE}" "${config_args[@]}" --format "${AGENT_REPLAY_FORMAT}"
            ;;
          assert)
            node "${AGENT_REPLAY_CLI}" assert "${AGENT_REPLAY_TRACE}" "${config_args[@]}" "${policy_args[@]}" --format "${AGENT_REPLAY_FORMAT}"
            ;;
          analyze)
            node "${AGENT_REPLAY_CLI}" analyze "${AGENT_REPLAY_TRACE}" "${config_args[@]}" "${analyze_args[@]}" --format "${AGENT_REPLAY_FORMAT}"
            ;;
          validate-and-assert)
            node "${AGENT_REPLAY_CLI}" validate "${AGENT_REPLAY_TRACE}" "${config_args[@]}" --format "${AGENT_REPLAY_FORMAT}"
            node "${AGENT_REPLAY_CLI}" assert "${AGENT_REPLAY_TRACE}" "${config_args[@]}" "${policy_args[@]}" --format "${AGENT_REPLAY_FORMAT}"
            ;;
          test)
            node "${AGENT_REPLAY_CLI}" test --baseline "${AGENT_REPLAY_BASELINE}" --actual "${AGENT_REPLAY_ACTUAL}" "${config_args[@]}" "${policy_args[@]}" --format "${AGENT_REPLAY_FORMAT}"
            ;;
          *)
            echo "Unsupported mode: ${AGENT_REPLAY_MODE}" >&2
            exit 2
            ;;
        esac
