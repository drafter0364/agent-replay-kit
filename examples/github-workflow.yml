name: Agent Trace Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trace-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: drafter0364/agent-replay-kit@main
        with:
          mode: validate-and-assert
          trace: examples/traces/sample.jsonl
          policy: examples/agent-replay.policy.json
          config-file: examples/agent-replay.policy.json
      - uses: drafter0364/agent-replay-kit@main
        with:
          mode: analyze
          trace: examples/traces/sample.jsonl
          max-shell-calls: 3
